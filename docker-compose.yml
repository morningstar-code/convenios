# Postgres opcional para desarrollo local (misma BD que producción Neon).
# Arranque: docker compose up -d
# DATABASE_URL=postgresql://postgres:postgres@localhost:5432/convenios

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: convenios
    ports:
      - "5432:5432"
    volumes:
      - convenios_pg:/var/lib/postgresql/data

volumes:
  convenios_pg:
